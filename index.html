<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050716" />
  <title>AR Hunt</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js (jsDelivr CDN — reliable) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<!-- AR SCENE -->
<a-scene
        id="arScene"
        embedded
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="alpha: true; antialias: true; precision: medium; logarithmicDepthBuffer: true"
        arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
>
  <a-assets>
    <a-asset-item
            id="campusModel"
            src="https://cdn.aframe.io/test-models/models/glTF-2.0/virtualcity/VC.glb"
    ></a-asset-item>
  </a-assets>

  <a-marker id="hiroMarker" preset="hiro" smooth="true" smoothCount="8">
    <a-entity
            id="campusModelEntity"
            gltf-model="#campusModel"
            scale="0.35 0.35 0.35"
            position="0 0 0"
            rotation="0 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
    ></a-entity>

    <a-box
            id="fallbackBox"
            position="0 0.5 0"
            scale="1 1 1"
            color="#22d3ee"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
    ></a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- UI OVERLAY -->
<div class="app-shell">
  <section class="hud" aria-label="AR Hunt game overlay">
    <div class="hud-row">
      <div id="scoreCounter" class="hud-chip score-chip">Score: 0 pts</div>
      <div class="menu-panel">
        <button id="resetGame" class="ghost-button" type="button">Reset</button>
      </div>
    </div>

    <div class="mission-panel" aria-live="polite">
      <p class="mission-kicker">Current mission</p>
      <h1 id="currentMission">🎯 Find the Library Mascot</h1>
      <p id="scanStatus" class="scan-status">Point your camera at the Hiro marker</p>
    </div>
  </section>

  <section class="bottom-hud">
    <div class="progress-card">
      <div class="progress-copy">
        <span id="progressText"><strong>0</strong>/5 missions completed</span>
        <span>+10 pts each</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <button id="leaderboardButton" class="leaderboard-button" type="button">
      🏆 Leaderboard
    </button>
  </section>
</div>

<!-- TOAST -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- LEADERBOARD MODAL -->
<div id="leaderboardModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modal-heading">
      <h2>🏆 Top Hunters</h2>
      <button id="closeLeaderboard" class="icon-button" type="button" aria-label="Close">×</button>
    </div>
    <ol id="leaderboardList" class="leaderboard-list"></ol>
  </div>
</div>

<script type="module" src="/game.js"></script>
</body>
</html>
