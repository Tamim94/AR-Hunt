<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050716" />
    <title>AR Hunt</title>
    <link rel="stylesheet" href="/style.css" />

    <!-- A-Frame renders the 3D scene; AR.js adds webcam marker tracking. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="hud" aria-label="AR Hunt game overlay">
        <div id="scoreCounter" class="hud-chip score-chip">Score: 0 pts</div>

        <div class="mission-panel" aria-live="polite">
          <p class="mission-kicker">Current mission</p>
          <h1 id="currentMission">🎯 Find the Library Mascot</h1>
          <p id="scanStatus" class="scan-status">Point your camera at the Hiro marker</p>
        </div>

        <div class="menu-panel">
          <button id="resetGame" class="ghost-button" type="button">Reset Game</button>
        </div>
      </section>

      <section class="bottom-hud" aria-label="Mission progress">
        <div class="progress-card">
          <div class="progress-copy">
            <span>Campus route</span>
            <strong id="progressText">0/5 missions completed</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <button id="leaderboardButton" class="leaderboard-button" type="button">
          🏆 Leaderboard
        </button>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div id="leaderboardModal" class="modal-backdrop" aria-hidden="true">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
          <div class="modal-heading">
            <div>
              <p class="mission-kicker">AR Hunt</p>
              <h2 id="leaderboardTitle">Leaderboard</h2>
            </div>
            <button id="closeLeaderboard" class="icon-button" type="button" aria-label="Close leaderboard">
              ×
            </button>
          </div>
          <ol id="leaderboardList" class="leaderboard-list"></ol>
        </section>
      </div>
    </main>

    <!-- The A-Frame scene sits behind the HTML HUD and owns the camera feed. -->
    <a-scene
      id="arScene"
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true"
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    >
      <a-assets timeout="8000">
        <a-asset-item
          id="campusModel"
          src="https://cdn.aframe.io/test-models/models/glTF-2.0/virtualcity/VC.glb"
        ></a-asset-item>
      </a-assets>

      <a-marker id="hiroMarker" preset="hiro" emitevents="true">
        <!-- This marker group floats and rotates when the Hiro marker is visible. -->
        <a-entity
          id="modelRoot"
          position="0 0.15 0"
          rotation="-90 0 0"
          animation__float="property: position; dir: alternate; dur: 1400; easing: easeInOutSine; loop: true; to: 0 0.45 0"
        >
          <a-entity
            id="campusModelEntity"
            gltf-model="#campusModel"
            scale="0.018 0.018 0.018"
            position="0 0 0"
            animation__spin="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true"
          ></a-entity>

          <!-- Hidden fallback that becomes visible if the GLB cannot be loaded. -->
          <a-box
            id="fallbackBox"
            visible="false"
            color="#22d3ee"
            depth="0.8"
            height="0.8"
            width="0.8"
            position="0 0.35 0"
            material="metalness: 0.35; roughness: 0.25; emissive: #6d28d9; emissiveIntensity: 0.45"
            animation__spin="property: rotation; to: 360 360 0; dur: 6500; easing: linear; loop: true"
          ></a-box>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script type="module" src="/game.js"></script>
  </body>
</html>
